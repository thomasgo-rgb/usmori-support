<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#fffaf4">
    <meta name="description" content="Open a private Usmori couple invitation.">
    <title>Usmori invitation</title>
    <link rel="stylesheet" href="./invite.css">
    <script type="module" src="./invite.js"></script>
  </head>
  <body>
    <div class="paper-glow" aria-hidden="true"></div>

    <header class="invite-header">
      <div class="invite-brand">
        <span class="invite-brand-name">Usmori</span>
      </div>
      <nav class="invite-languages" aria-label="Language">
        <button class="invite-language" type="button" data-language="ko" lang="ko" aria-pressed="false">한국어</button>
        <button class="invite-language" type="button" data-language="ja" lang="ja" aria-pressed="false">日本語</button>
        <button class="invite-language" type="button" data-language="en" lang="en" aria-pressed="true">English</button>
      </nav>
    </header>

    <main id="main" class="invite-page">
      <article class="invite-card">
        <div class="invite-media">
          <img id="invite-picture" src="./usmori-avatar.jpg" alt="Usmori otter" width="1080" height="1080" decoding="async">
        </div>
        <div id="invite-root" class="invite-content"></div>
        <noscript>
          <div class="invite-noscript">
            <h1>Usmori invitation</h1>
            <p lang="ko">초대를 열거나 복사하려면 JavaScript가 필요해요. 원본 메시지를 지우지 말고 그대로 남겨 주세요.</p>
            <p lang="ja">招待を開く、またはコピーするにはJavaScriptが必要です。元のメッセージはそのまま残してください。</p>
            <p lang="en">JavaScript is needed to open or copy the invitation. Please keep the original message.</p>
          </div>
        </noscript>
      </article>
    </main>
  </body>
</html>
